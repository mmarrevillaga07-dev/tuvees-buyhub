<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUVEES BuyHub | Official Showcase</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
</head>
<body>

    <header>
        <!-- Sleek Theme Toggle Switch Container -->
        <div class="theme-toggle-container">
            <button id="theme-toggle-btn" aria-label="Toggle theme">
                <!-- SVG Icon for Dark Mode Moon / Light Mode Sun -->
                <svg id="theme-icon" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></svg>
            </button>
        </div>

        <!-- Corrected Heading Hierarchy -->
        <h1><span class="brand-name">TUVEES<sup>™</sup></span> BuyHub</h1>
        <p>Premium handpicked gear. Click to shop directly from the manufacturer.</p>
    </header>


    <main class="product-grid">
        <!-- Product Card 1 -->
        <div class="product-card">
            <div class="media-container">
                <!-- Autoplay, muted, looping video for sleek product demonstration -->
                <video src="assets/product-video-1.mp4" poster="assets/product-image-1.jpg" autoplay loop muted playsinline></video>
            </div>
            <div class="product-info">
                <h3>Minimalist Mechanical Keyboard</h3>
                <p>Ultra-responsive switches with an anodized aluminum finish.</p>
                <!-- Direct Affiliate Link -->
                <a href="YOUR_AFFILIATE_LINK_HERE" target="_blank" rel="noopener nofollow" class="buy-btn">View Official Store</a>
            </div>
        </div>

        <!-- Add more product cards by copying the structure above -->
    </main>

    <script src="app.js"></script>
</body>
</html>
